<h1 class="my-3 text-primary">
    Listar Produtos
    <button routerLink="/produtos/cadastrar" class="btn btn-success mt-2 float-end">Cadastrar</button>
</h1>

<div class="card shadow">
    <table class="table table-responsive table striped">
        <!--table-responsive-> para ser responsiva
        table.striped-> alterna a cor das linhas da tabela (linhas zebradas)!-->
        <thead>
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Validade</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Curso de Angular</td>
                <td>21/12/2026</td>
                <td>R$ 500,00</td>
                <td>
                    <button class="btn btn-warning">
                        <i class="fas fa-edit"></i>
                    </button>

                    <button class="btn btn-danger ms-2">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>


</div>
